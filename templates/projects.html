{% extends 'layout.html' %}

{% block title %}Projects{% endblock %}

{% block main %}
<div class="container py-3 py-sm-5">
  <h1 class="mb-4">{{ content['h1']['content'] }}</h1>
  <p class="mb-4">{{ content['description']['content'] }}</p>

  <div class="row">
    {% for project in projects %}
    <div class="col-lg-6 col-xxl-4 mb-4">
      <div class="card shadow-sm h-100 mx-auto">
        <img src="./img/{{ project['img'] }}" class="card-img-top" alt="Preview of {{ project['title'] }}">
        <div class="card-body d-flex flex-column align-items-center">
          <h2 class="card-title fs-5">{{ project['title'] }}</h2>
          <p class="card-text">{{ project['content'] }}</p>
          <a href="{{ project['repo_link'] }}" class="btn btn-primary mt-auto mb-2">GitHub repository</a>
          <a href="{{ project['preview_link'] }}" class="btn btn-primary">Live preview</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>


{% endblock %}
