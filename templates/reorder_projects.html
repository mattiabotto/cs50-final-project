{% extends 'admin_layout.html' %}

{% block title %}Admin{% endblock %}

{% block main %}

<div class="container py-3 py-sm-5">
  <h1 class="mb-3 mb-sm-5">Reorder projects</h1>
  <form method="post">
    <ul id="reorder-list" class="list-group mb-3 mb-sm-5">
      {% for project in projects%}
      <li class="d-flex justify-content-between align-items-center list-group-item project-list-item">
        <input type="hidden" name="project_id" value="{{ project['id'] }}">
        <h2 class="project-title fs-5">{{ project['title'] }}</h2>
        <div>
          <button type="button" class="btn btn-up">▲</button>
          <button type="button" class="btn btn-down">▼</button>
        </div>
      </li>
      {% endfor %}
    </ul>

    <div class="d-flex justify-content-start gap-5 mb-3 mb-sm-5">
      <button type="submit" class="btn btn-success">Save</button>
      <a href="{{ url_for('admin_projects') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock%}

{% block scripts %}
<script src="{{ url_for('static', filename='reorder.js') }}" defer></script>
{% endblock %}
